<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance Technique - JEF 2026</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19; /* Même fond sombre que ton panel */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 40px;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            margin: 20px;
        }
        .icon {
            font-size: 64px;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        h1 {
            font-size: 24px;
            color: #f39c12; /* Couleur orange/or pour le côté prestige */
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        p {
            font-size: 16px;
            line-height: 1.6;
            color: #9ca3af;
            margin-bottom: 30px;
        }
        .badge {
            background-color: rgba(243, 156, 18, 0.1);
            color: #f39c12;
            padding: 8px 16px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 14px;
            display: inline-block;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">🏆</div>
        <h1>Maintenance technique – JEF 2026</h1>
        <p>
            La plateforme de vote est temporairement suspendue pour la mise à jour des scores 
            et le contrôle rigoureux des flux financiers par le comité d'organisation.
        </p>
        <div class="badge">⏳ Réouverture prochaine • Merci de votre confiance ! 👑</div>
    </div>

</body>
</html>
