<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Admin - MISS FLLAC</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-4 md:p-8">
    
    <div class="max-w-5xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
            <h1 class="text-2xl font-black text-yellow-500 uppercase tracking-tighter">Validation des Votes</h1>
            <button onclick="logout()" class="text-xs bg-red-600 px-3 py-1 rounded-full uppercase font-bold">Déconnexion</button>
        </div>

        <div class="grid gap-4" id="votesList">
            <p class="text-center text-gray-500 animate-pulse italic">Chargement des données sécurisées...</p>
        </div>
    </div>

    <script>
        // Gestion du mot de passe
        let adminPass = sessionStorage.getItem('admin_pass');

        if (!adminPass) {
            adminPass = prompt("Entrez le code Administrateur :");
            if (adminPass) {
                sessionStorage.setItem('admin_pass', adminPass);
                loadVotes();
            }
        }

        function logout() {
            sessionStorage.removeItem('admin_pass');
            location.reload();
        }

        async function loadVotes() {
            try {
                const res = await fetch('/api/admin/votes', {
                    headers: { 'x-admin-password': adminPass }
                });

                if (res.status === 401) {
                    alert("Code incorrect !");
                    sessionStorage.removeItem('admin_pass');
                    location.reload();
                    return;
                }

                const votes = await res.json();
                const container = document.getElementById('votesList');
                container.innerHTML = '';

                if (votes.length === 0) {
                    container.innerHTML = '<p class="text-gray-500 text-center py-10">Aucun vote en attente.</p>';
                    return;
                }

                votes.forEach(v => {
                    const isValide = v.status === 'VALIDE';
                    const card = document.createElement('div');
                    card.className = `p-4 rounded-2xl border-2 transition-all ${isValide ? 'border-green-500 bg-green-900/10' : 'border-gray-700 bg-gray-800'}`;
                    
                    card.innerHTML = `
                        <div class="flex flex-col md:flex-row items-center gap-4 justify-between">
                            <div class="flex items-center gap-4 w-full">
                                <img src="${v.screenshot_url}" class="w-16 h-16 object-cover rounded-xl cursor-pointer border border-gray-600" onclick="window.open('${v.screenshot_url}')">
                                <div>
                                    <h3 class="font-bold text-lg">${v.candidate}</h3>
                                    <p class="text-yellow-500 font-black">${v.count} votes (${v.count * 100}F)</p>
                                    <p class="text-[10px] text-gray-500 italic">${new Date(v.created_at).toLocaleString('fr-FR')}</p>
                                </div>
                            </div>
                            <div class="w-full md:w-auto">
                                ${!isValide ? 
                                    `<button onclick="valider('${v.id}')" class="w-full bg-green-600 hover:bg-green-500 px-6 py-2 rounded-xl font-black transition">VALIDER</button>` : 
                                    `<span class="block text-center text-green-400 font-bold border border-green-400/30 px-4 py-2 rounded-xl">✅ ACCEPTÉ</span>`
                                }
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                console.error("Erreur:", err);
            }
        }

        async function valider(id) {
            if(!confirm("Confirmer ce paiement ?")) return;
            try {
                const res = await fetch('/api/admin/valider', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-admin-password': adminPass
                    },
                    body: JSON.stringify({ id })
                });
                if(res.ok) loadVotes();
            } catch (err) {
                alert("Erreur réseau");
            }
        }

        if (adminPass) {
            setInterval(loadVotes, 10000);
            loadVotes();
        }
    </script>
</body>
</html>
